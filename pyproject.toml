[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lastexam"
version = "0.1.0"
description = "Reproducible task suites and evaluation tools for AI agents, starting with quantum science"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{name = "LastExam contributors"}]
keywords = ["benchmark", "agents", "quantum", "evaluation", "AI"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lastexam-org/lastexam"
Repository = "https://github.com/lastexam-org/lastexam"
Issues = "https://github.com/lastexam-org/lastexam/issues"

[project.scripts]
lastexam = "lastexam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lastexam = ["data/*.json"]
